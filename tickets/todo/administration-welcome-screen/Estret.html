<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Inici a 1024×768</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:"Manrope","Segoe UI",system-ui,sans-serif;background:#f5f1ea}
a{color:#241c14}a:hover{color:#8f3216}
</style>
</head>
<body>
<div style="width: 1024px; height: 768px; box-sizing: border-box; display: flex; background: #f5f1ea; color: #241c14; overflow: hidden">

  <div style="width: 64px; flex-shrink: 0; box-sizing: border-box; padding: 8px; background: #fffdf9; border-right: 1px solid #96896f; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <button type="button" aria-label="Obre el menú" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: transparent; border: 0; border-radius: 10px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="Estret.dc.html" aria-label="Inici" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: #e7b8a4; border: 1px solid #b8481f; border-radius: 10px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
    </a>
    <a href="#" aria-label="Vendes" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 7H6"/></svg></a>
    <a href="#" aria-label="Editar vendes" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M14.5 5.5 18.5 9.5"/></svg></a>
    <a href="#" aria-label="Reposició i encàrrecs" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z"/><path d="M3 6.5 12 11l9-4.5"/><path d="M12 11v11"/></svg></a>
    <a href="#" aria-label="Clients" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 5.2a3.5 3.5 0 0 1 0 5.6"/><path d="M18.5 14.4A6.5 6.5 0 0 1 21.5 20"/></svg></a>
    <a href="#" aria-label="Moviments de caixa" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.6 5 3 5 1.3 5 3-2.2 3-5 3-5-1.1-5-3"/></svg></a>
    <a href="#" aria-label="Tancar caixa" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></a>
    <a href="#" aria-label="Informes" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 9.5 10.5l4 4L21 7"/><path d="M15 7h6v6"/></svg></a>
    <a href="#" aria-label="Configuració" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></a>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 26px 28px 0; display: flex; flex-direction: column; position: relative; overflow: hidden">

    <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Bon dia, Albert. Què vols fer?</h1>

    <div style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; height: 48px; margin-top: 18px; padding: 0 14px; background: #ece5d6; border: 1px solid #96896f; border-radius: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6154" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <label for="q3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Cerca una tasca</label>
      <input id="q3" type="search" placeholder="Cerca una tasca…" style="flex-grow: 1; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #241c14">
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 24px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #6b6154">HABITUAL</span>
      <div style="flex-grow: 1; height: 1px; background: #96896f; opacity: 0.45"></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px">

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 7H6"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Vendre</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Atendre un client al taulell</span></span>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 2.8h6v3.4H9z"/><path d="M8.5 11.5h7M8.5 16h4.5"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Reposició i encàrrecs</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Què falta i què han demanat els clients</span></span>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z"/><path d="M3 6.5 12 11l9-4.5"/><path d="M12 11v11"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Afegir o canviar un producte</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Preus, codis de barres i dades del catàleg</span></span>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Els darrers tancaments</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Quants diners hi ha hagut a caixa</span></span>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 5.2a3.5 3.5 0 0 1 0 5.6"/><path d="M18.5 14.4A6.5 6.5 0 0 1 21.5 20"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Clients i deutes</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Fitxes, saldos i pagaments</span></span>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; min-height: 92px; padding: 16px; text-align: left; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08); font-family: inherit; color: #241c14; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><path d="M3 17 9.5 10.5l4 4L21 7"/><path d="M15 7h6v6"/></svg>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; line-height: 23px">Com van les vendes</span><span style="font-size: 13px; line-height: 18px; color: #6b6154">Resum per dia i per període</span></span>
      </button>

    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 26px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #6b6154">TOT EL QUE POTS FER</span>
      <div style="flex-grow: 1; height: 1px; background: #96896f; opacity: 0.45"></div>
    </div>

    <div style="margin-top: 12px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #6b6154; margin-bottom: 4px">VENDRE I COBRAR</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px">
        <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 14px; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Vendre</a>
        <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 14px; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Editar vendes fetes</a>
      </div>
    </div>

    <div style="position: absolute; right: 10px; top: 100px; width: 6px; height: 240px; border-radius: 999px; background: #96896f; opacity: 0.4"></div>
  </div>

</div>
</body>
</html>
