<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Pantalla inicial — proposta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Manrope","Segoe UI",system-ui,sans-serif;background:#f5f1ea;color:#241c14}
a{color:#b8481f}a:hover{color:#8f3216}
button{font-family:inherit}
</style>
</head>
<body>

<div style="width: 1024px; height: 768px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f1ea; overflow: hidden">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 18px; background: #fffdf9; border-bottom: 1px solid #96896f">
    <div style="display: flex; align-items: center; padding: 12px 18px 12px 0; border-right: 1px solid #96896f">
      <div style="width: 78px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px dashed #96896f; border-radius: 6px; font-size: 11px; line-height: 14px; font-weight: 600; color: #6b6154">Window.Logo</div>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 12px">
      <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #241c14">Botiga Sant Antoni</div>
      <div style="padding: 3px 10px; border-radius: 999px; background: rgba(122,83,0,0.14); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.04em; color: #7a5300">MODE DEMO</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
      <div style="font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace; font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: #241c14">18:42</div>
      <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6154">Dijous, 24 de setembre</div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; overflow: hidden">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6b6154">Caixa 1 · Magatzem principal</div>
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: #241c14">Què vols fer?</h1>
    </div>

    <div style="box-sizing: border-box; width: 560px; padding: 14px 20px; display: flex; align-items: center; gap: 14px; background: #fffdf9; border: 1px solid #96896f; border-radius: 16px; box-shadow: 0 1px 2px rgba(36,28,20,0.08)">
      <div style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(31,107,92,0.14)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f6b5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        <span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.04em; color: #1f6b5c">CAIXA OBERTA</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #241c14">Sessió <span style="font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace; font-weight: 500; font-variant-numeric: tabular-nums">148</span></div>
        <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6154">Oberta des de les <span style="font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">08:55</span> · <span style="font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">37</span> tiquets</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">

      <button type="button" style="box-sizing: border-box; width: 560px; min-height: 88px; padding: 18px 24px; display: flex; align-items: center; gap: 16px; background: #b8481f; color: #ffffff; border: 1px solid #b8481f; border-radius: 10px; outline: 2px solid #6b5f47; outline-offset: 3px; text-align: left; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16l-1.4 10.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8Z"></path><path d="M9 7V5.5a3 3 0 0 1 6 0V7"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; line-height: 24px; font-weight: 700">Vendes</span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 500">Obre la caixa i comença a vendre</span>
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>

      <a href="Administracio.html" style="box-sizing: border-box; width: 560px; min-height: 88px; padding: 18px 24px; display: flex; align-items: center; gap: 16px; background: #fffdf9; color: #241c14; border: 1px solid #96896f; border-radius: 10px; text-align: left; text-decoration: none; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#fffdf9"></circle><circle cx="15" cy="12" r="2" fill="#fffdf9"></circle><circle cx="8" cy="17" r="2" fill="#fffdf9"></circle></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; line-height: 24px; font-weight: 700">Administració</span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6154">Gestiona productes, estoc i configuració</span>
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6b6154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>

    </div>

  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 0 24px 20px; display: flex; align-items: center; gap: 12px">
    <button type="button" style="box-sizing: border-box; min-height: 48px; padding: 0 16px; background: transparent; border: 0; border-radius: 10px; font-size: 15px; line-height: 22px; font-weight: 500; color: #6b6154; cursor: pointer">Quant a</button>
    <div style="flex-grow: 1"></div>
    <button type="button" style="box-sizing: border-box; min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #fffdf9; border: 1px solid #8a2a22; border-radius: 10px; font-size: 15px; line-height: 22px; font-weight: 500; color: #8a2a22; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a2a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path><path d="M15 8l4 4-4 4"></path><path d="M19 12H9"></path></svg>
      Tanca l'aplicació
    </button>
  </div>

</div>

</body>
</html>
