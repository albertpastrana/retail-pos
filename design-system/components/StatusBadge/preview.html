<!-- @dsCard group="Feedback" height=120 -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: var(--space-6); background: var(--surface-0); display: flex; gap: var(--space-3); flex-wrap: wrap; font-family: var(--font-sans); }
  .badge {
    display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3);
    border-radius: var(--radius-full); font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .badge.success { background: color-mix(in srgb, var(--success) 16%, var(--surface-100)); color: var(--success); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 18%, var(--surface-100)); color: var(--warning); }
  .badge.danger  { background: color-mix(in srgb, var(--danger) 16%, var(--surface-100)); color: var(--danger); }
  .badge.info    { background: color-mix(in srgb, var(--info) 16%, var(--surface-100)); color: var(--info); }
</style>
</head>
<body>
  <span class="badge success">Paid</span>
  <span class="badge warning">Low stock</span>
  <span class="badge danger">Void</span>
  <span class="badge info">Pending</span>
</body>
</html>
