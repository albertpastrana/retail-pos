<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 48" width="258" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!--
  Derivation (per cover.md / craft.md — kept for future edits):
  Shape:  rounded square = radius-lg (16px token, scaled) price tag; the
          circle is the tag's string-hole, cut as a true transparent mask
          so the mark reads on any background, not just white.
  Motif:  a literal retail motif (the price tag), not a monogram —
          Retail POS is an app for small shops, and the tag is the one
          object every one of them already has on the counter.
  Colour: brand token only (terracotta), on-ink for the wordmark.
  Scale:  64x64 base grid so it holds up down to a 16px favicon.
-->
  <mask id="hole">
    <rect x="0" y="0" width="48" height="48" fill="#ffffff"/>
    <circle cx="15.75" cy="15.75" r="4.5" fill="#000000"/>
  </mask>
  <rect x="4.5" y="4.5" width="39" height="39" rx="10.5" fill="#e2764c" mask="url(#hole)"/>
  <text x="64" y="33" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="27" letter-spacing="-0.5" fill="#f3ece1">Retail POS</text>
</svg>
