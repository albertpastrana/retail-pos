<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!--
  Derivation: printer-safe variant of the mark + wordmark, pure black on the
  receipt's own white stock — no greys, no transparency, so ESC/POS raster
  dithering can't speckle it. Used for Printer.Ticket.Logo and Window.Logo.
-->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#000000"/>
  <circle cx="24" cy="24" r="6.5" fill="#ffffff"/>
  <text x="76" y="42" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="30" letter-spacing="-0.5" fill="#000000">Retail POS</text>
</svg>
