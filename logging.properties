# java.util.logging — loaded by start.sh / start.bat / configure.sh
#
# Only the console handler is configured here. Every launch also writes
# <install>/logs/pos-0.log … pos-4.log (10 MB, rotate), added by FileLogging;
# with javaw there is no console to read, so those files are the record.

handlers=java.util.logging.ConsoleHandler

.level=INFO

# PreparedSentence / StaticSentence log every SQL at INFO.
com.openbravo.data.loader.level=WARNING

java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.encoding=UTF-8
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# 2026-09-11 23:33:01 INFO    com.openbravo.pos.forms.StartPOS main message
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$-7s %2$s %5$s%6$s%n
