name: retail-pos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pos
      MYSQL_DATABASE: pos
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppos"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 15s
