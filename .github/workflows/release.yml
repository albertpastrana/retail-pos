name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  integration:
    name: Release integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 120

      - name: Run integration checks
        run: ./gradlew ciCheck

      - if: failure()
        name: Show database logs
        run: docker compose logs

      - if: always()
        name: Stop databases
        run: docker compose down -v

  package:
    name: Package ${{ matrix.platform }}
    needs: integration
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            gradle_args: ""
          - platform: windows
            runner: windows-latest
            gradle_args: "-x checkMigrationChecksums"
          - platform: macos
            runner: macos-15-intel
            gradle_args: ""

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build application
        shell: bash
        run: ./gradlew -PappVersion="${GITHUB_REF_NAME#v}" check ${{ matrix.gradle_args }}

      - name: Create portable package
        shell: bash
        run: bash scripts/package-portable.sh "${{ matrix.platform }}" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
