name: build

on:
  push:
  pull_request:

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew spotlessCheck

  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew verifyTestLaneCoverage fastTest

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-reports
          path: |
            build/test-results/fastTest
            build/reports/tests/fastTest
          if-no-files-found: warn

  derby-tests:
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew verifyTestLaneCoverage derbyTest

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: derby-test-reports
          path: |
            build/test-results/derbyTest
            build/reports/tests/derbyTest
          if-no-files-found: warn

  external-database-tests:
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: docker compose up -d --wait --wait-timeout 120

      - run: ./gradlew verifyTestLaneCoverage externalDatabaseTest

      - if: failure()
        run: docker compose logs

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-database-test-reports
          path: |
            build/test-results/externalDatabaseTest
            build/reports/tests/externalDatabaseTest
          if-no-files-found: warn

      - if: always()
        run: docker compose down -v

  check:
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew check

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: warn
