# Retail POS design system — light theme ("Light — sales floor")
# Loaded automatically by FlatLaf.registerCustomDefaultsSource("com.openbravo.pos.theme")
# whenever com.formdev.flatlaf.FlatLightLaf is the active look and feel — the
# filename must match the FlatLaf class's simple name, that's how FlatLaf finds it.
# Values copied verbatim from design-system/tokens.json's light column.
# If a value here ever disagrees with tokens.json, tokens.json is the
# source of truth and this file is stale — see design-system/swing-development.md.

# Surfaces
@background = #f5f1ea
Panel.background = #f5f1ea
@componentBackground = #fffdf9
List.background = #fffdf9
Table.background = #fffdf9
Table.alternateRowColor = #e5dac5
TextField.background = #e5dac5
ComboBox.background = #e5dac5
ComboBox.buttonBackground = #e5dac5
Spinner.background = #e5dac5

# Text
@foreground = #241c14
Button.foreground = #241c14
Label.disabledForeground = #6b6154
@disabledForeground = #6b6154

# Borders and focus
@borderColor = #96896f
Component.focusColor = #6b5f47
Component.focusWidth = 2
Button.focusedBorderColor = #6b5f47

# Brand accent — the ONE primary action per screen, per design-system/README.md "Colour"
@accentColor = #b8481f
Button.default.background = #b8481f
Button.default.foreground = #ffffff
Button.default.focusedForeground = #241c14
Button.default.hoverBackground = #8f3216
Button.background = #fffdf9
Button.hoverBackground = #fffdf9
Button.borderColor = #96896f
Button.hoverBorderColor = #6b5f47
CheckBox.icon.background = #e5dac5
CheckBox.icon.borderColor = #96896f
CheckBox.icon.selectedBackground = #b8481f
CheckBox.icon.selectedBorderColor = #b8481f
List.selectionBackground = #e7b8a4
List.selectionForeground = #241c14
Table.selectionBackground = #e7b8a4
Table.selectionForeground = #241c14

# Retail POS tokens, exposed as plain UIManager colours so any screen can pull
# them by name (see com.openbravo.pos.theme.RetailPOSColors) instead of
# hardcoding hex — this is the same light/dark set as tokens.json's "color" section.
retailpos.surface0 = #f5f1ea
retailpos.surface100 = #fffdf9
retailpos.surface200 = #e5dac5
retailpos.ink = #241c14
retailpos.inkMuted = #6b6154
retailpos.border = #96896f
retailpos.borderStrong = #6b5f47
retailpos.brand = #b8481f
retailpos.brandStrong = #8f3216
retailpos.brandSubtle = #e7b8a4
retailpos.onBrand = #ffffff
retailpos.success = #1f6b5c
retailpos.warning = #7a5300
retailpos.danger = #8a2a22
retailpos.info = #3c6e8f

# Shape — radius-md (buttons, keys, tiles); components needing radius-lg or
# radius-sm set arc explicitly per component, this is only the default
@arc = 10
Button.arc = 10
Component.arc = 10
TextComponent.arc = 6

# Type
defaultFont = Manrope 15
