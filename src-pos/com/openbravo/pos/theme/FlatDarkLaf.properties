# Retail POS design system — dark theme ("Dark — evening till")
# Loaded automatically by FlatLaf.registerCustomDefaultsSource("com.openbravo.pos.theme")
# whenever com.formdev.flatlaf.FlatDarkLaf is the active look and feel — the
# filename must match the FlatLaf class's simple name, that's how FlatLaf finds it.
# Values copied verbatim from design-system/tokens.json's dark column.
# Same key list as FlatLightLaf.properties — never invert the light
# file's values with a filter, copy them from the token. If a value here
# ever disagrees with tokens.json, tokens.json is the source of truth and
# this file is stale — see design-system/swing-development.md.

# Surfaces
@background = #1b1712
Panel.background = #1b1712
@componentBackground = #241f19
List.background = #241f19
Table.background = #241f19
Table.alternateRowColor = #2e2820
TextField.background = #2e2820
Spinner.background = #2e2820

# Text
@foreground = #f3ece1
Label.disabledForeground = #b2a695
@disabledForeground = #b2a695

# Borders and focus
@borderColor = #786b57
Component.focusColor = #9c8e73
Component.focusWidth = 2
Button.focusedBorderColor = #9c8e73

# Brand accent — the ONE primary action per screen, per design-system/README.md "Colour"
@accentColor = #e2764c
Button.default.background = #e2764c
Button.default.foreground = #2b1206
Button.default.hoverBackground = #f0925f

# Retail POS tokens, exposed as plain UIManager colours so any screen can pull
# them by name (see com.openbravo.pos.theme.RetailPOSColors) instead of
# hardcoding hex — this is the same light/dark set as tokens.json's "color" section.
retailpos.surface0 = #1b1712
retailpos.surface100 = #241f19
retailpos.surface200 = #2e2820
retailpos.ink = #f3ece1
retailpos.inkMuted = #b2a695
retailpos.border = #786b57
retailpos.borderStrong = #9c8e73
retailpos.brand = #e2764c
retailpos.brandStrong = #f0925f
retailpos.onBrand = #2b1206
retailpos.success = #4fbfa0
retailpos.warning = #d9a23c
retailpos.danger = #c9463a
retailpos.info = #7cc0e0

# Shape — radius-md (buttons, keys, tiles); components needing radius-lg or
# radius-sm set arc explicitly per component, this is only the default
@arc = 10
Button.arc = 10
Component.arc = 10
TextComponent.arc = 6

# Type
defaultFont = Manrope 15
